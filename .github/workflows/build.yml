name: Publish executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CONSOLE_PROJECT: src/AudiobookGenerator.Console/YewCone.AudiobookGenerator.Console.csproj

jobs:

  test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Test
      run: dotnet test

  build:
    needs: test

    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
        selfcontained: [true, false]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Publish
      run: dotnet publish --runtime ${{ matrix.runtime }} --self-contained ${{ matrix.selfcontained }}

    - name: Upload build artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.runtime }}${{ matrix.selfcontained && '-selfcontained' || '' }}
        path: artifacts/publish/**

  console-aot:
    name: Native AOT console (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: win-x64
          runner: windows-2025
          executable: YewCone.AudiobookGenerator.Console.exe
          vc_host_arch: x64
          vc_target_arch: x64
        - rid: win-arm64
          runner: windows-11-arm
          executable: YewCone.AudiobookGenerator.Console.exe
          vc_host_arch: ARM64
          vc_target_arch: arm64
        - rid: linux-x64
          runner: ubuntu-24.04
          executable: YewCone.AudiobookGenerator.Console
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
          executable: YewCone.AudiobookGenerator.Console
        - rid: osx-x64
          runner: macos-15-intel
          executable: YewCone.AudiobookGenerator.Console
        - rid: osx-arm64
          runner: macos-15
          executable: YewCone.AudiobookGenerator.Console

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Install Linux Native AOT prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang zlib1g-dev libicu-dev ffmpeg
        clang --version
        dpkg -s libicu-dev | grep '^Status: install ok installed$'
        ffmpeg -version
        ffprobe -version

    - name: Install macOS Native AOT prerequisites
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        xcrun --find clang
        if ! command -v ffmpeg >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
        fi
        clang --version
        ffmpeg -version
        ffprobe -version

    - name: Install Windows Native AOT prerequisites
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vsWhere = Join-Path ([System.Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path $vsWhere)) {
            throw "vswhere.exe not found at $vsWhere"
        }

        $installationPath = & $vsWhere -latest -products * -property installationPath
        if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'Visual Studio installation was not found.'
        }

        $msvcVersion = Get-ChildItem -Path (Join-Path $installationPath 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
        if ($null -eq $msvcVersion) {
            throw "MSVC toolset was not found under $installationPath"
        }

        $candidateLinkers = @(
            (Join-Path $msvcVersion.FullName "bin\Host${{ matrix.vc_host_arch }}\${{ matrix.vc_target_arch }}\link.exe")
            (Join-Path $msvcVersion.FullName "bin\Hostx64\${{ matrix.vc_target_arch }}\link.exe")
            (Join-Path $msvcVersion.FullName "bin\HostARM64\${{ matrix.vc_target_arch }}\link.exe")
        ) | Select-Object -Unique
        $linkerPath = $candidateLinkers | Where-Object { Test-Path $_ } | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($linkerPath)) {
            throw "Native AOT linker for ${{ matrix.rid }} was not found under $($msvcVersion.FullName)"
        }

        Write-Host "Using Visual Studio at $installationPath"
        Write-Host "Using MSVC linker at $linkerPath"
        Split-Path -Parent $vsWhere | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
        }

        if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw 'ffmpeg was not found after installation.'
        }

        ffmpeg -version
        ffprobe -version

    - name: Publish Native AOT console
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $outputPath = Join-Path (Resolve-Path .) 'artifacts/aot/${{ matrix.rid }}'
        if (Test-Path $outputPath) {
            Remove-Item -Recurse -Force $outputPath
        }

        dotnet publish $env:CONSOLE_PROJECT `
          -c Release `
          -r ${{ matrix.rid }} `
          --self-contained true `
          -p:PortableAot=true `
          -p:ILLinkTreatWarningsAsErrors=true `
          -warnaserror `
          -o $outputPath

        Get-ChildItem $outputPath

    - name: Test portable code paths
      shell: pwsh
      run: >
        dotnet test tests/AudiobookGenerator.Core.Tests/YewCone.AudiobookGenerator.Core.Tests.csproj
        -c Release
        -r ${{ matrix.rid }}
        -p:PortableAot=true
        --nologo

    - name: Smoke test Native AOT console
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $artifactPath = Join-Path (Resolve-Path .) 'artifacts/aot/${{ matrix.rid }}'
        $executablePath = Join-Path $artifactPath '${{ matrix.executable }}'
        if (-not (Test-Path $executablePath)) {
            Write-Host "Native AOT output contents for ${{ matrix.rid }}:"
            Get-ChildItem -Recurse $artifactPath | Select-Object FullName
            throw "Native executable not found at $executablePath"
        }

        & ./tests/Smoke/Invoke-PortableConsoleSmoke.ps1 -ExecutablePath $executablePath

    - name: Package Windows Native AOT artifact
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $packageDirectory = Join-Path (Resolve-Path .) 'artifacts/aot-packages'
        New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
        Compress-Archive `
          -Path 'artifacts/aot/${{ matrix.rid }}/*' `
          -DestinationPath "$packageDirectory/console-aot-${{ matrix.rid }}.zip" `
          -CompressionLevel Optimal

    - name: Package Unix Native AOT artifact
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p artifacts/aot-packages
        tar \
          -C "artifacts/aot/${{ matrix.rid }}" \
          -czf "artifacts/aot-packages/console-aot-${{ matrix.rid }}.tar.gz" \
          .

    - name: Upload Native AOT artifact
      uses: actions/upload-artifact@v4
      with:
        name: console-aot-${{ matrix.rid }}
        path: artifacts/aot-packages/console-aot-${{ matrix.rid }}.*
        if-no-files-found: error
        compression-level: 0
